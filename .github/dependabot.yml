version: 2
updates:
  # flake.lock is deliberately not listed here: .github/workflows/update-packages.yml
  # bumps nixpkgs together with the dependency hashes that bump invalidates, so
  # a lock-only PR can never land with stale hashes behind it.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
